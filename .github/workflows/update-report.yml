name: Update monthly GitHub report

on:
  schedule:
      - cron: "17 0 * * *"
        workflow_dispatch:

        permissions:
          contents: write
            pages: write
              id-token: write

              concurrency:
                group: github-pages
                  cancel-in-progress: false

                  jobs:
                    update-and-deploy:
                        runs-on: ubuntu-latest
                            environment:
                                  name: github-pages
                                        url: ${{ steps.deployment.outputs.page_url }}
                                            steps:
                                                  - name: Check out repository
                                                          uses: actions/checkout@v4

                                                                - name: Set up Python
                                                                        uses: actions/setup-python@v5
                                                                                with:
                                                                                          python-version: "3.12"

                                                                                                - name: Refresh report from public PR data
                                                                                                        env:
                                                                                                                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                          run: python update_report.py
                                                                                                                          
                                                                                                                                - name: Commit report changes
                                                                                                                                        run: |
                                                                                                                                                  git config user.name "github-actions[bot]"
                                                                                                                                                            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                      git add github-2026-ytd-monthly-report.html
                                                                                                                                                                                if git diff --cached --quiet; then
                                                                                                                                                                                            echo "Report is already up to date."
                                                                                                                                                                                                      else
                                                                                                                                                                                                                  git commit -m "chore: update GitHub activity report"
                                                                                                                                                                                                                              git push
                                                                                                                                                                                                                                        fi
                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                              - name: Prepare Pages artifact
                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                mkdir -p site
                                                                                                                                                                                                                                                                          cp github-2026-ytd-monthly-report.html site/
                                                                                                                                                                                                                                                                                    cp github-2026-ytd-monthly-report.html site/index.html
                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                          - name: Upload Pages artifact
                                                                                                                                                                                                                                                                                                  uses: actions/upload-pages-artifact@v3
                                                                                                                                                                                                                                                                                                          with:
                                                                                                                                                                                                                                                                                                                    path: site
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                          - name: Deploy Pages
                                                                                                                                                                                                                                                                                                                                  id: deployment
                                                                                                                                                                                                                                                                                                                                          uses: actions/deploy-pages@v4
                                                                                                                                                                                                                                                                                                                                          
